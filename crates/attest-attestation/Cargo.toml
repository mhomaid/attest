[package]
name = "attest-attestation"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Enables the AWS KMS signer (`kms` module). The default build pulls in no AWS
# dependencies. A production `KmsApi` transport wraps `aws-sdk-kms`; the tested
# path uses the offline `RecordedKmsClient`. See docs/20_Signer_KMS.md.
aws-kms = []

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
ed25519-dalek = { workspace = true }
futures = "0.3"
hex = { workspace = true }
object_store = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "sync"] }
tracing = { workspace = true }
uuid = { workspace = true }

