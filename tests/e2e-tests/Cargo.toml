[package]
name = "e2e-tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

# This crate has no library — only integration test binaries.
[lib]
name = "e2e_tests"
path = "src/lib.rs"

[[test]]
name = "phase1_streaming"
path = "tests/phase1_streaming.rs"

[[test]]
name = "phase2_iceberg"
path = "tests/phase2_iceberg.rs"

[[test]]
name = "phase3_detection"
path = "tests/phase3_detection.rs"

[[test]]
name = "phase4a_triager"
path = "tests/phase4a_triager.rs"

[[test]]
name = "phase_arroyo_pipelines"
path = "tests/phase_arroyo_pipelines.rs"

[[test]]
name = "phase4b_llm_escalation"
path = "tests/phase4b_llm_escalation.rs"

[[test]]
name = "phase5_guardrails"
path = "tests/phase5_guardrails.rs"

[dev-dependencies]
chrono = { workspace = true }
rdkafka = { workspace = true }
reqwest = { version = "0.12", features = ["json"] }
serde_json = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
uuid = { workspace = true }
