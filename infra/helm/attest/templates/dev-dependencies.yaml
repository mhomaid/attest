{{- /*
Bundled single-replica dependencies for local demos (kind, minikube). Off by default.
Data is in emptyDir and auth is disabled. Do not use in production: point the chart at
external services through kafka.*, clickhouse.*, postgres.* and objectStore.* instead.
*/ -}}
{{- $full := include "attest.fullname" . -}}
{{- $labels := include "attest.labels" . -}}
{{- $selectors := include "attest.selectorLabels" . -}}
{{- $dev := .Values.devDependencies -}}
{{- if $dev.postgres.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-dev-postgres
  labels:
    {{- $labels | nindent 4 }}
    app.kubernetes.io/component: dev-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- $selectors | nindent 6 }}
      app.kubernetes.io/component: dev-postgres
  template:
    metadata:
      labels:
        {{- $labels | nindent 8 }}
        app.kubernetes.io/component: dev-postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ $dev.postgres.image }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: POSTGRES_USER
              value: attest
            - name: POSTGRES_DB
              value: attest
            # Dev only: no password. Reachable from this release's pods only (NetworkPolicy).
            - name: POSTGRES_HOST_AUTH_METHOD
              value: trust
          ports:
            - containerPort: 5432
              name: pg
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "attest", "-d", "attest"]
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: data, emptyDir: {} }
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-dev-postgres
  labels:
    {{- $labels | nindent 4 }}
    app.kubernetes.io/component: dev-postgres
spec:
  selector:
    {{- $selectors | nindent 4 }}
    app.kubernetes.io/component: dev-postgres
  ports:
    - { port: 5432, targetPort: pg, name: pg }
{{- end }}
{{- if $dev.clickhouse.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-dev-clickhouse
  labels:
    {{- $labels | nindent 4 }}
    app.kubernetes.io/component: dev-clickhouse
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- $selectors | nindent 6 }}
      app.kubernetes.io/component: dev-clickhouse
  template:
    metadata:
      labels:
        {{- $labels | nindent 8 }}
        app.kubernetes.io/component: dev-clickhouse
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clickhouse
          image: {{ $dev.clickhouse.image }}
          env:
            - name: CLICKHOUSE_SKIP_USER_SETUP
              value: "1"
          ports:
            - { containerPort: 8123, name: http }
            - { containerPort: 9000, name: native }
          readinessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/clickhouse }
      volumes:
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-dev-clickhouse
  labels:
    {{- $labels | nindent 4 }}
    app.kubernetes.io/component: dev-clickhouse
spec:
  selector:
    {{- $selectors | nindent 4 }}
    app.kubernetes.io/component: dev-clickhouse
  ports:
    - { port: 8123, targetPort: http, name: http }
    - { port: 9000, targetPort: native, name: native }
{{- end }}
{{- if $dev.redpanda.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-dev-redpanda
  labels:
    {{- $labels | nindent 4 }}
    app.kubernetes.io/component: dev-redpanda
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- $selectors | nindent 6 }}
      app.kubernetes.io/component: dev-redpanda
  template:
    metadata:
      labels:
        {{- $labels | nindent 8 }}
        app.kubernetes.io/component: dev-redpanda
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redpanda
          image: {{ $dev.redpanda.image }}
          args:
            - redpanda
            - start
            - --overprovisioned
            - --smp=1
            - --memory=1G
            - --reserve-memory=0M
            - --node-id=0
            - --check=false
            - --kafka-addr=PLAINTEXT://0.0.0.0:9092
            - --advertise-kafka-addr=PLAINTEXT://{{ $full }}-dev-redpanda:9092
          ports:
            - { containerPort: 9092, name: kafka }
          readinessProbe:
            tcpSocket: { port: kafka }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 1Gi }
            limits: { cpu: "1", memory: 1536Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/redpanda/data }
      volumes:
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-dev-redpanda
  labels:
    {{- $labels | nindent 4 }}
    app.kubernetes.io/component: dev-redpanda
spec:
  selector:
    {{- $selectors | nindent 4 }}
    app.kubernetes.io/component: dev-redpanda
  ports:
    - { port: 9092, targetPort: kafka, name: kafka }
{{- end }}
