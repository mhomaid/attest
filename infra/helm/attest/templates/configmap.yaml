apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "attest.fullname" . }}-env
  labels:
    {{- include "attest.labels" . | nindent 4 }}
data:
  TENANT_ID: {{ .Values.env.TENANT_ID | quote }}
  KAFKA_BROKERS: {{ .Values.env.KAFKA_BROKERS | quote }}
  CLICKHOUSE_URL: {{ .Values.env.CLICKHOUSE_URL | quote }}
  RISINGWAVE_HOST: {{ .Values.env.RISINGWAVE_HOST | quote }}
  RISINGWAVE_PORT: {{ .Values.env.RISINGWAVE_PORT | quote }}
  ICEBERG_WAREHOUSE: {{ .Values.env.ICEBERG_WAREHOUSE | quote }}
  S3_ENDPOINT: {{ .Values.objectStore.endpoint | quote }}
  S3_BUCKET: {{ .Values.objectStore.bucket | quote }}
  S3_REGION: {{ .Values.objectStore.region | quote }}
  TABLE_PREFIX: cloudtrail
