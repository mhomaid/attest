{{- if and (not .Values.objectStore.existingSecret) (not .Values.objectStore.useIrsa) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "attest.objectStoreSecret" . }}
  labels:
    {{- include "attest.labels" . | nindent 4 }}
type: Opaque
stringData:
  access-key: {{ required "objectStore.accessKey (or existingSecret / useIrsa)" .Values.objectStore.accessKey | quote }}
  secret-key: {{ required "objectStore.secretKey (or existingSecret / useIrsa)" .Values.objectStore.secretKey | quote }}
  signing-key: {{ .Values.signingKey | quote }}
{{- else if and (not .Values.objectStore.existingSecret) .Values.signingKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "attest.fullname" . }}-signing
  labels:
    {{- include "attest.labels" . | nindent 4 }}
type: Opaque
stringData:
  signing-key: {{ .Values.signingKey | quote }}
{{- end }}
