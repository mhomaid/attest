# Reference values. Same container artifacts as Compose / Railway.
# This chart does not install Redpanda, RisingWave, ClickHouse, or MinIO.

image:
  registry: ghcr.io/mhomaid
  tag: "0.1.0"
  pullPolicy: IfNotPresent
  pullSecrets: []

replicaCount: 1

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # eks.amazonaws.com/role-arn: arn:aws:iam::123:role/attest-warm-irsa

# Rust images still run as root (see infra/docker). Workbench is uid 1001.
# Set runAsNonRoot: true only after those Dockerfiles gain a USER.
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 512Mi

ingress:
  enabled: false
  className: nginx
  host: attest.example.com
  annotations: {}
  tls: []

objectStore:
  # Empty = AWS default endpoint + IRSA. Set for MinIO or GCS HMAC
  # (https://storage.googleapis.com).
  endpoint: ""
  bucket: attest-warm
  region: us-east-1
  # When true, do not mount static S3 keys (IRSA / instance role).
  useIrsa: false
  existingSecret: ""
  # Used only when existingSecret is empty and useIrsa is false (local MinIO).
  accessKey: ""
  secretKey: ""

# Hex Ed25519 seed. Empty → orchestrator mints an ephemeral key (dev only).
signingKey: ""

services:
  collector:
    enabled: true
    port: 4000
    healthPath: /healthz
  controlPlane:
    enabled: true
    port: 8080
    healthPath: /healthz
  orchestrator:
    enabled: true
    port: 4300
    healthPath: /healthz
  mcpGateway:
    enabled: true
    port: 4242
    healthPath: /healthz
  storageIceberg:
    enabled: true
    port: null
    healthPath: ""
  workbench:
    enabled: true
    port: 3000
    healthPath: /api/healthz

env:
  TENANT_ID: default
  KAFKA_BROKERS: redpanda:9092
  CLICKHOUSE_URL: http://clickhouse:8123
  RISINGWAVE_HOST: risingwave
  RISINGWAVE_PORT: "4566"
  ICEBERG_WAREHOUSE: s3://attest-warm
