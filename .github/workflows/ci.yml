name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt · clippy · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install librdkafka build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake libcurl4-openssl-dev libssl-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: classifier latency budget (release)
        run: |
          test -f ml/triager/artifacts/model.onnx
          cargo test --release -p attest-onnx-runtime --test classifier_integration -- --nocapture

  python:
    name: Python (uv · pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Run tests
        working-directory: ml
        run: uv sync --frozen && uv run pytest triager/ test_smoke.py -q

      - name: Investigator eval (scripted model)
        working-directory: eval
        run: |
          uv run --with pytest python -m pytest bots_eval/test_harness.py -q
          uv run --with pytest python -m bots_eval --out results/investigator-bots.json

      - name: Upload investigator eval result
        uses: actions/upload-artifact@v6
        with:
          name: investigator-bots
          path: eval/results/investigator-bots.json

  typescript:
    name: TypeScript (bun · typecheck · lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.x"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck
        working-directory: apps/workbench

      - name: Lint
        run: bun run lint
        working-directory: apps/workbench

      - name: Test
        run: bun run test

  helm:
    name: Helm (lint · template · kubeconform)
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.6.7
    steps:
      - uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Install kubeconform
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: helm lint + template + hardening checks
        run: make helm-template

      - name: kubeconform schema check
        run: make helm-kubeconform

  integration:
    name: Integration (docker-compose smoke)
    runs-on: ubuntu-latest
    needs: [rust, python, typescript]
    steps:
      - uses: actions/checkout@v7

      - name: Start core services (blocks until every healthcheck passes)
        run: docker compose up -d --wait --wait-timeout 240 redpanda postgres garage garage-init clickhouse risingwave

      - name: Smoke — round-trip through each service
        run: |
          set -euo pipefail
          docker compose exec -T redpanda rpk topic create ci-smoke
          echo '{"smoke":true}' | docker compose exec -T redpanda rpk topic produce ci-smoke
          docker compose exec -T redpanda rpk topic consume ci-smoke --num 1 --format '%v\n' | grep -qx '{"smoke":true}'
          test "$(curl -sf 'http://localhost:8123/?query=SELECT%201')" = "1"
          docker compose exec -T postgres psql -U attest -d attest -tAc 'SELECT 1' | grep -qx 1
          docker compose exec -T postgres psql -h risingwave -p 4566 -U root -d dev -tAc 'SELECT 1' | grep -qx 1

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

  workbench-e2e:
    name: Workbench (Playwright)
    # ubuntu-latest is 26.04, and Playwright 1.59 cannot install browser
    # dependencies there. 24.04 is the newest image it supports.
    runs-on: ubuntu-24.04
    needs: [typescript]
    services:
      postgres:
        image: postgres:18.7
        env:
          POSTGRES_USER: attest
          POSTGRES_PASSWORD: attest
          POSTGRES_DB: attest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.x"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"

      - name: Apply Postgres schema (Alembic / UV)
        working-directory: infra/db
        env:
          DATABASE_URL: postgresql://attest:attest@localhost:5432/attest
        run: uv sync --frozen && uv run alembic upgrade head

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: apps/workbench
        run: bunx playwright install --with-deps chromium firefox webkit

      # Generic realm `example` (infra/keycloak/example-realm.json). Services cannot mount
      # repo files, so Keycloak runs as a plain container started after checkout.
      - name: Start Keycloak (realm example)
        run: |
          docker run -d --name keycloak -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -v "$PWD/infra/keycloak:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:26.4 start-dev --import-realm
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8080/realms/example/.well-known/openid-configuration && exit 0
            sleep 3
          done
          docker logs keycloak
          exit 1

      - name: Run Playwright E2E
        working-directory: apps/workbench
        env:
          ATTEST_E2E_OIDC: "1"
          ATTEST_E2E_KEYCLOAK_URL: http://localhost:8080
          DATABASE_URL: postgres://attest:attest@localhost:5432/attest
          ALLOW_AUTH_SEED: "1"
          AUTH_SEED_SECRET: ci-auth-seed-secret
          BETTER_AUTH_SECRET: local-dev-better-auth-secret-min-32-chars!!
        run: bun run e2e

      - name: Keycloak logs on failure
        if: failure()
        run: docker logs keycloak --tail 200
