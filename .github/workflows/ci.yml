name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt · clippy · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

  python:
    name: Python (uv · pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run tests
        run: uv run pytest ml/

  typescript:
    name: TypeScript (bun · typecheck · lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.x"

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck
        working-directory: apps/workbench

      - name: Lint
        run: bun run lint
        working-directory: apps/workbench

      - name: Test
        run: bun run test

  integration:
    name: Integration (docker-compose smoke)
    runs-on: ubuntu-latest
    needs: [rust, python, typescript]
    steps:
      - uses: actions/checkout@v4

      - name: Start core services
        run: docker compose up -d redpanda postgres minio clickhouse risingwave

      - name: Wait for services
        run: sleep 20

      - name: Smoke — healthz
        run: |
          docker compose ps
          curl -sf http://localhost:9092 || true
          curl -sf http://localhost:8123/ping || echo "ClickHouse not yet ready (acceptable in scaffold)"
