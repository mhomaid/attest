name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt · clippy · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install librdkafka build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake libcurl4-openssl-dev libssl-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: classifier latency budget (release)
        run: |
          test -f ml/triager/artifacts/model.onnx
          cargo test --release -p attest-onnx-runtime --test classifier_integration -- --nocapture

  python:
    name: Python (uv · pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Run tests
        working-directory: ml
        run: uv sync --frozen && uv run pytest triager/ test_smoke.py -q

  typescript:
    name: TypeScript (bun · typecheck · lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.x"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck
        working-directory: apps/workbench

      - name: Lint
        run: bun run lint
        working-directory: apps/workbench

      - name: Test
        run: bun run test

  integration:
    name: Integration (docker-compose smoke)
    runs-on: ubuntu-latest
    needs: [rust, python, typescript]
    steps:
      - uses: actions/checkout@v7

      - name: Start core services (blocks until every healthcheck passes)
        run: docker compose up -d --wait --wait-timeout 240 redpanda postgres minio clickhouse risingwave

      - name: Smoke — round-trip through each service
        run: |
          set -euo pipefail
          docker compose exec -T redpanda rpk topic create ci-smoke
          echo '{"smoke":true}' | docker compose exec -T redpanda rpk topic produce ci-smoke
          docker compose exec -T redpanda rpk topic consume ci-smoke --num 1 --format '%v\n' | grep -qx '{"smoke":true}'
          test "$(curl -sf 'http://localhost:8123/?query=SELECT%201')" = "1"
          docker compose exec -T postgres psql -U attest -d attest -tAc 'SELECT 1' | grep -qx 1
          docker compose exec -T postgres psql -h risingwave -p 4566 -U root -d dev -tAc 'SELECT 1' | grep -qx 1

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

  workbench-e2e:
    name: Workbench (Playwright)
    runs-on: ubuntu-latest
    needs: [typescript]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: attest
          POSTGRES_PASSWORD: attest
          POSTGRES_DB: attest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.x"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"

      - name: Apply Postgres schema (Alembic / UV)
        working-directory: infra/db
        env:
          DATABASE_URL: postgresql://attest:attest@localhost:5432/attest
        run: uv sync --frozen && uv run alembic upgrade head

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: apps/workbench
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Run Playwright E2E
        working-directory: apps/workbench
        env:
          DATABASE_URL: postgres://attest:attest@localhost:5432/attest
          ALLOW_AUTH_SEED: "1"
          AUTH_SEED_SECRET: ci-auth-seed-secret
          BETTER_AUTH_SECRET: local-dev-better-auth-secret-min-32-chars!!
        run: bun run e2e
