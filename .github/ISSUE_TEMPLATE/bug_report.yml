name: Bug report
description: Something is broken or behaves differently from the docs
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security vulnerability? Please use [private reporting](https://github.com/mhomaid/attest/security/advisories/new) instead — see SECURITY.md.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Orchestrator / triage agents
        - Inference router / classifier
        - Attestation (signing, verify, replay)
        - HELIQL detections
        - Collector / streaming / storage
        - MCP gateway / policy
        - Workbench (UI)
        - Local stack (docker compose)
        - Docs
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, input events, or a failing test. Minimal is best.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
  - type: input
    id: version
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD`
    validations:
      required: true
