# Version-update PRs are paused. Weekly one-crate PRs (and grouped 20-crate
# bombs) cost more review time than they save on a solo repo.
# Security alerts stay in the Security tab; we bump deps when we choose to.
#
# To turn version PRs back on: restore grouped monthly updates, ignore majors,
# and set open-pull-requests-limit to 1.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: /apps/workbench
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: pip
    directory: /ml
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: pip
    directory: /infra/db
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
