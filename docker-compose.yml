name: attest

services:
  redpanda:
    image: redpandadata/redpanda:v26.2.3
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092,HOST://0.0.0.0:19092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092,HOST://localhost:19092
    ports:
      - "9092:9092"
      - "19092:19092"
    volumes:
      # Persists topics/partitions across `docker compose down` (omit `down -v`).
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 5s
      timeout: 10s
      retries: 20

  redpanda-console:
    image: redpandadata/console:v2.8.16
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8081:8080"
    depends_on:
      - redpanda

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: attest
      POSTGRES_USER: attest
      POSTGRES_PASSWORD: attest
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ stores data under /var/lib/postgresql/<version>/docker.
      # Mount the parent so the image can initialize a fresh cluster.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attest -d attest"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Official community `minio/minio` and `quay.io/minio/minio` pulls are denied.
  # `quay.io/minio/aistor/minio` is the current official image, but it refuses
  # every S3 call until a MinIO license is installed (`mc license update`).
  # A public clone cannot ship that file, so local/dev uses the pgsty rebuild
  # (same `minio`/`mc` binaries, no license gate).
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Creates required MinIO buckets on first start.
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/attest-warm;
        mc policy set public local/attest-warm;
        mc mb --ignore-existing local/attest-attestations;
        mc mb --ignore-existing local/attest-cloudtrail;
        mc mb --ignore-existing local/risingwave;
        echo 'MinIO buckets ready';
      "
    restart: on-failure

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      # Required: without these the entrypoint disables all network access.
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9002:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./infra/clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - ./infra/clickhouse/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  risingwave:
    image: risingwavelabs/risingwave:v3.0.4
    command: single_node
    environment:
      # Durable state: Hummock SST files stored in MinIO; catalog/meta stored on local volume.
      RW_STATE_STORE: hummock+minio://minioadmin:minioadmin@minio:9000/risingwave
      RW_DATA_DIRECTORY: attest-data
    ports:
      - "4566:4566"
    volumes:
      - risingwave-data:/data
    depends_on:
      # Hummock needs the `risingwave` bucket, which minio-init creates.
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/4566'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  arroyo:
    image: ghcr.io/arroyosystems/arroyo:0.14.1
    ports:
      - "5115:5115"
    environment:
      DATABASE_URL: postgres://attest:attest@postgres:5432/attest
      # S3 / MinIO credentials for filesystem sink (Parquet output)
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      # AWS_ENDPOINT_URL is the standard env var for S3-compatible endpoint override
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_ENDPOINT: http://minio:9000
      AWS_REGION: us-east-1
      # Allow HTTP (non-HTTPS) for local MinIO
      AWS_ALLOW_HTTP: "true"
      # Redpanda bootstrap — referenced by pipeline SQL as 'redpanda:9092'
      KAFKA_BROKERS: redpanda:9092
    volumes:
      # Mount pipeline SQL files — deployer reads from /pipelines inside the container
      - ./infra/arroyo/pipelines:/pipelines:ro
    depends_on:
      - postgres
      - minio-init
      - redpanda
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5115/api/v1/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    profiles:
      - platform

  # One-shot service: waits for Arroyo to be healthy then deploys all SQL pipelines.
  # Uses the same Arroyo image — has bash, python3, and curl already available.
  arroyo-pipeline-deployer:
    image: ghcr.io/arroyosystems/arroyo:0.14.1
    entrypoint: ["/bin/bash", "/usr/local/bin/deploy-pipelines.sh"]
    environment:
      ARROYO_API: http://arroyo:5115
      PIPELINES_DIR: /pipelines
    volumes:
      - ./infra/arroyo/pipelines:/pipelines:ro
      - ./infra/arroyo/deploy-pipelines.sh:/usr/local/bin/deploy-pipelines.sh:ro
    depends_on:
      arroyo:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: on-failure
    profiles:
      - platform

  # llama.cpp HTTP server — model GGUF must be volume-mounted at runtime.
  # Pull a Qwen 3 ~7B GGUF and set LLAMA_MODEL_PATH on first run.
  llama-cpp:
    image: ghcr.io/ggerganov/llama.cpp:server
    ports:
      - "8088:8080"
    volumes:
      - llama-models:/models
    command: >
      --model /models/qwen3-7b.gguf
      --host 0.0.0.0
      --port 8080
      --ctx-size 4096
    profiles:
      - llm

  collector:
    build:
      context: .
      dockerfile: infra/docker/collector.Dockerfile
    ports:
      - "4000:4000"
    environment:
      KAFKA_BROKERS: redpanda:9092
      TENANT_ID: local-dev
      PORT: "4000"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://minio:9000
      COLLECTOR_S3_ALLOWED_BUCKETS: attest-cloudtrail
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      OTEL_SERVICE_NAME: attest-collector
    depends_on:
      - redpanda
      - tempo
      - minio
    profiles:
      - platform

  control-plane:
    build:
      context: .
      dockerfile: infra/docker/control-plane.Dockerfile
    ports:
      - "8080:8080"
    environment:
      RISINGWAVE_HOST: risingwave
      RISINGWAVE_PORT: "4566"
      CLICKHOUSE_URL: http://clickhouse:8123
      KAFKA_BROKERS: redpanda:9092
      PORT: "8080"
      LOAD_GEN_URL: http://load-gen:9100
      ORCHESTRATOR_URL: http://orchestrator:4300
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      OTEL_SERVICE_NAME: attest-control-plane
    depends_on:
      - risingwave
      - redpanda
      - clickhouse
      - tempo
    profiles:
      - platform

  storage-iceberg:
    build:
      context: .
      dockerfile: infra/docker/storage-iceberg.Dockerfile
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPIC: cloudtrail
      KAFKA_GROUP_ID: attest-iceberg-writer
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: attest-warm
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
      TABLE_PREFIX: cloudtrail
      ICEBERG_WAREHOUSE: s3://attest-warm
      BATCH_SIZE: "1000"
      FLUSH_INTERVAL_SECS: "30"
    depends_on:
      - redpanda
      - minio
      - minio-init
    profiles:
      - platform

  detection-runtime:
    build:
      context: .
      dockerfile: infra/docker/detection-runtime.Dockerfile
    environment:
      RULES_DIR: /rules
      RISINGWAVE_HOST: risingwave
      RISINGWAVE_PORT: "4566"
      KAFKA_BROKERS: redpanda:9092
      ALERTS_TOPIC: alerts
      POLL_INTERVAL_SECS: "2"
    volumes:
      - ./detections:/rules:ro
    depends_on:
      - risingwave
      - redpanda
    profiles:
      - platform

  calibration-sidecar:
    build:
      context: .
      dockerfile: infra/docker/calibration-sidecar.Dockerfile
    ports:
      - "5001:5001"
    environment:
      CALIBRATION_PORT: "5001"
      ARTIFACTS_DIR: /app/artifacts
      PYTHONUNBUFFERED: "1"
    profiles:
      - platform

  orchestrator:
    build:
      context: .
      dockerfile: infra/docker/orchestrator.Dockerfile
    ports:
      - "4300:4300"
    # Load `ATTEST_LLM_*`, guardrails, etc. from repo `.env`. Overrides below win (Compose merge order).
    # Optional so a fresh clone starts without copying env.example first.
    env_file:
      - path: .env
        required: false
    extra_hosts:
      # Linux: map host gateway (Docker Desktop already provides host.docker.internal on Mac/Win).
      - "host.docker.internal:host-gateway"
    environment:
      ORCHESTRATOR_PORT: "4300"
      ARTIFACTS_DIR: /artifacts
      CALIBRATION_URL: http://calibration-sidecar:5001
      ESCALATION_THRESHOLD: "0.60"
      NOVELTY_THRESHOLD: "0.70"
      ATTEST_LOG_PATH: /data/attestations.ndjson
      ATTEST_LOG_S3_BUCKET: attest-attestations
      ATTEST_LOG_S3_PREFIX: attestations
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://minio:9000
      MCP_GATEWAY_URL: http://mcp-gateway:4242
      SYSTEM_PROMPT_PATH: /agents/triager/system_prompt_v1.md
      REVIEWER_PROMPT_PATH: /agents/triager/reviewer_prompt_v1.md
      INVESTIGATOR_PROMPT_PATH: /agents/investigator/system_prompt_v1.md
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      OTEL_SERVICE_NAME: attest-orchestrator
      KAFKA_BROKERS: redpanda:9092
      # Must override `.env` (which uses 127.0.0.1 for native runs). Unsloth runs on the host.
      ATTEST_LLM_BASE_URL: ${ATTEST_LLM_DOCKER_BASE_URL:-http://host.docker.internal:8888/v1}
    volumes:
      - ./ml/triager/artifacts:/artifacts:ro
      - ./agents:/agents:ro
      - attestation-log:/data
    depends_on:
      - calibration-sidecar
      - mcp-gateway
      - tempo
      - redpanda
      - minio
    profiles:
      - platform

  ws-gateway:
    build:
      context: .
      dockerfile: infra/docker/ws-gateway.Dockerfile
    ports:
      - "4500:4500"
    env_file:
      - path: .env
        required: false
    environment:
      ATTEST_WS_GATEWAY_PORT: "4500"
      KAFKA_BROKERS: redpanda:9092
      DATABASE_URL: postgres://attest:attest@postgres:5432/attest
      ATTEST_WS_JWT_SECRET: ${ATTEST_WS_JWT_SECRET:-dev-ws-jwt-secret-change-me}
      ATTEST_TRACE_WRITER_GROUP_ID: ${ATTEST_TRACE_WRITER_GROUP_ID:-attest-trace-writer}
      ATTEST_TRACE_WRITER_OFFSET_RESET: ${ATTEST_TRACE_WRITER_OFFSET_RESET:-latest}
    depends_on:
      - redpanda
      - postgres
    profiles:
      - platform

  mcp-gateway:
    build:
      context: .
      dockerfile: infra/docker/mcp-gateway.Dockerfile
    ports:
      - "4242:4242"
    environment:
      MCP_GATEWAY_PORT: "4242"
      CONTROL_PLANE_URL: http://control-plane:8080
      ATTEST_LOG_PATH: /data/attestations.ndjson
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      OTEL_SERVICE_NAME: attest-mcp-gateway
    volumes:
      - attestation-log:/data
    depends_on:
      - control-plane
      - tempo
    profiles:
      - platform

  ml-sidecar:
    build:
      context: ./ml/sidecar
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
    profiles:
      - ml

  load-gen:
    build:
      context: .
      dockerfile: infra/docker/load-gen.Dockerfile
    ports:
      - "9100:9100"
    environment:
      KAFKA_BROKERS: redpanda:9092
      LOAD_GEN_PORT: "9100"
      RUST_LOG: info
    depends_on:
      - redpanda
    profiles:
      - bench

volumes:
  redpanda-data:
  postgres-data:
  minio-data:
  clickhouse-data:
  tempo-data:
  llama-models:
  attestation-log:
  risingwave-data:
