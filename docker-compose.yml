services:
  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092,HOST://0.0.0.0:19092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092,HOST://localhost:19092
    ports:
      - "9092:9092"
      - "19092:19092"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: attest
      POSTGRES_USER: attest
      POSTGRES_PASSWORD: attest
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Creates the attest-warm bucket on first start.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/attest-warm;
        mc policy set public local/attest-warm;
        echo 'MinIO bucket ready';
      "
    restart: on-failure

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    environment:
      # Required: without these the entrypoint disables all network access.
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9002:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./infra/clickhouse/config.d:/etc/clickhouse-server/config.d:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  risingwave:
    image: risingwavelabs/risingwave:latest
    command: playground
    ports:
      - "4566:4566"

  arroyo:
    image: ghcr.io/arroyosystems/arroyo:latest
    ports:
      - "5115:5115"
    environment:
      DATABASE_URL: postgres://attest:attest@postgres:5432/attest
      # S3 / MinIO credentials for filesystem sink (Parquet output)
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_ENDPOINT: http://minio:9000
      AWS_REGION: us-east-1
      # Redpanda bootstrap — referenced by pipeline SQL as 'redpanda:9092'
      KAFKA_BROKERS: redpanda:9092
    volumes:
      # Mount pipeline SQL files — deployer reads from /pipelines inside the container
      - ./infra/arroyo/pipelines:/pipelines:ro
    depends_on:
      - postgres
      - minio-init
      - redpanda
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5115/api/v1/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    profiles:
      - platform

  # One-shot service: waits for Arroyo to be healthy then deploys all SQL pipelines.
  arroyo-pipeline-deployer:
    image: curlimages/curl:latest
    entrypoint: ["/bin/sh", "/pipelines/deploy-pipelines.sh"]
    environment:
      ARROYO_API: http://arroyo:5115
      PIPELINES_DIR: /pipelines
    volumes:
      - ./infra/arroyo/pipelines:/pipelines:ro
      - ./infra/arroyo/deploy-pipelines.sh:/pipelines/deploy-pipelines.sh:ro
    depends_on:
      arroyo:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: on-failure
    profiles:
      - platform

  # llama.cpp HTTP server — model GGUF must be volume-mounted at runtime.
  # Pull a Qwen 3 ~7B GGUF and set LLAMA_MODEL_PATH on first run.
  llama-cpp:
    image: ghcr.io/ggerganov/llama.cpp:server
    ports:
      - "8088:8080"
    volumes:
      - llama-models:/models
    command: >
      --model /models/qwen3-7b.gguf
      --host 0.0.0.0
      --port 8080
      --ctx-size 4096
    profiles:
      - llm

  collector:
    build:
      context: .
      dockerfile: infra/docker/collector.Dockerfile
    ports:
      - "4000:4000"
    environment:
      KAFKA_BROKERS: redpanda:9092
      TENANT_ID: local-dev
      PORT: "4000"
    depends_on:
      - redpanda
    profiles:
      - platform

  control-plane:
    build:
      context: .
      dockerfile: infra/docker/control-plane.Dockerfile
    ports:
      - "8080:8080"
    environment:
      RISINGWAVE_HOST: risingwave
      RISINGWAVE_PORT: "4566"
      CLICKHOUSE_URL: http://clickhouse:8123
      PORT: "8080"
    depends_on:
      - risingwave
      - redpanda
      - clickhouse
    profiles:
      - platform

  storage-iceberg:
    build:
      context: .
      dockerfile: infra/docker/storage-iceberg.Dockerfile
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPIC: cloudtrail
      KAFKA_GROUP_ID: attest-iceberg-writer
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: attest-warm
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
      TABLE_PREFIX: cloudtrail
      BATCH_SIZE: "1000"
      FLUSH_INTERVAL_SECS: "30"
    depends_on:
      - redpanda
      - minio
      - minio-init
    profiles:
      - platform

  detection-runtime:
    build:
      context: .
      dockerfile: infra/docker/detection-runtime.Dockerfile
    environment:
      RULES_DIR: /rules
      RISINGWAVE_HOST: risingwave
      RISINGWAVE_PORT: "4566"
      KAFKA_BROKERS: redpanda:9092
      ALERTS_TOPIC: alerts
      POLL_INTERVAL_SECS: "2"
    volumes:
      - ./detections:/rules:ro
    depends_on:
      - risingwave
      - redpanda
    profiles:
      - platform

  ml-sidecar:
    build:
      context: ./ml/sidecar
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
    profiles:
      - ml

volumes:
  postgres-data:
  minio-data:
  clickhouse-data:
  llama-models:
