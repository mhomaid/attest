[workspace]
members = [
    "crates/*",
    "apps/workbench-api",
    "apps/ws-gateway",
    "tests/e2e-tests",
]
exclude = ["apps/workbench"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "UNLICENSED"
repository = "https://github.com/mohamedhomaid/attest"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
rdkafka = { version = "0.36", features = ["cmake-build"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs", "net"] }
tokio-postgres = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
# Phase 2 — Iceberg warm tier
arrow = "58.1"
parquet = { version = "58.1", features = ["async"] }
object_store = { version = "0.13", features = ["aws"] }
iceberg = "0.9"
iceberg-catalog-rest = "0.9"
