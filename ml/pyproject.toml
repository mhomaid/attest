[project]
name = "attest-ml"
version = "0.1.0"
description = "Attest ML sidecar — Triager classifier training, novelty detection, calibration"
requires-python = ">=3.11"
dependencies = [
    "xgboost>=2.0.3",
    "shap>=0.45.0",
    "scikit-learn>=1.4.0",
    "onnx>=1.16.0",
    "onnxmltools>=1.12.0",
    "skl2onnx>=1.16.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "flask>=3.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
]
