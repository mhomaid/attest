# Public datasets the training and eval code is allowed to name.
# Checksums are sha256 or md5 of the file fetch stores. `sha256:unpinned` means
# no file digest is known yet; `make dataset-fetch` refuses that id.
# Do not commit anything under cache/.
datasets:
  - id: guide
    source_url: https://www.kaggle.com/datasets/Microsoft/microsoft-security-incident-prediction
    license: CDLA-Permissive-2.0
    allowed_use: [train, eval]
    checksum: "sha256:unpinned"
    citation: >-
      Freitas, Scott; Kalajdjieski, Jovan; Gharib, Amir; McCann, Robert.
      AI-Driven Guided Response for Security Operation Centers with Microsoft
      Copilot for Security. arXiv:2407.09017, 2024.
      https://arxiv.org/abs/2407.09017

  - id: rba-login
    source_url: https://zenodo.org/records/6782156/files/rba-dataset.zip
    filename: rba-dataset.zip
    license: CC-BY-4.0
    allowed_use: [train, eval]
    checksum: "md5:cc1b1078b3929650e6c08678caffcc57"
    citation: >-
      Wiefling, Stephan; Jørgensen, Paul René; Thunem, Sigurd; Lo Iacono, Luigi.
      Pump Up Password Security! Evaluating and Enhancing Risk-Based
      Authentication on a Real-World Large-Scale Online Service.
      ACM Transactions on Privacy and Security, 2022.
      https://doi.org/10.1145/3546069

  - id: splunk-bots
    source_url: https://s3.amazonaws.com/botsdataset/botsv2/botsv2_data_set.tgz
